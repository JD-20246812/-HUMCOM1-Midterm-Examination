    <section id="contact" class="tab-content">
        <h2>Contact</h2>
        <form actiom="#" method="POST">
            <fieldset>
                <Legend>Form</Legend>
                <p>
                    <label for="Full Name">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </p> 
                <br>
                <p>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </p> 
                <br>
                <label for="Inquire Type">Inquire Type:</label>
                <input type="text" id="inquires" name="inquires" list="inquierer" required>

                <datalist id="inquierer">
              <option value="Prices">
              <option value="Payment">
              <option value="Question">
              <option value="Job services">
            </datalist> <br>

            <br>

                <label for="messenger">Message</label> 
                <textarea id="messenger" name="messenger" rows="3" required minlength="3"></textarea>
            </fieldset>
        </form>
    </section>
